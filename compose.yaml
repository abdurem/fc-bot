services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - league-data:/app/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  league-data:
